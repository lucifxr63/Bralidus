name: bralidus-api-cron

# Agenda los 9 jobs del scheduler de la API de Bralidus (bralidus-api en Vercel),
# que en serverless no corre APScheduler. Cada schedule dispara POST /jobs/run/{id}
# con BRALIDUS_CRON_SECRET. Reemplaza al scheduler in-proc (patrón igual al de S-Pulse).
#
# NOTA: los `schedule` sólo corren desde la rama default (master) — activar tras merge.
# Horarios en UTC (Chile = UTC-4 en invierno). Los jobs pesados (radar/cmf/seia/concursal)
# pueden exceder el límite de 60s de Vercel Hobby → considerar Pro o correrlos en el runner.

on:
  schedule:
    - cron: '*/30 * * * *'       # radar_refresh (cada 30 min)
    - cron: '0 */2 * * *'        # cache_sweep (cada 2 h)
    - cron: '15 13,17,21 * * *'  # cmf_sync (9/13/17:15 Chile)
    - cron: '30 11 * * 1-5'      # concursal_sync (lun-vie 07:30 Chile)
    - cron: '0 11 * * 1'         # bcch_sync (lun 07:00 Chile)
    - cron: '0 13 * * 6'         # empleo_sync (sáb 09:00 Chile)
    - cron: '0 12 */3 * *'       # seia_sync (cada 3 días 08:00 Chile)
    - cron: '0 3 * * 0'          # fred_sync (dom 03:00)
    - cron: '0 4 1 * *'          # yfinance_sync (día 1, 04:00)
    - cron: '20 */6 * * *'       # embeddings_pendientes (cada 6 h, :20)
                                 #
                                 # NO ESTABA AGENDADO. El job existe en _JOBS y
                                 # es disparable por HTTP, pero nada lo llamaba:
                                 # había que acordarse a mano.
                                 #
                                 # Un nodo sin embedding NO ES RECUPERABLE. Así
                                 # que un extractor podía insertar contenido
                                 # perfecto y el RAG no verlo nunca, sin que
                                 # fallara nada — el nodo está, la corrida cierra
                                 # en verde, y la única señal es que las
                                 # respuestas no lo mencionan. Se detectó el
                                 # 2026-08-06 al reubicar 4 chunks en CAL-3b:
                                 # quedaron con el contenido intacto e
                                 # invisibles.
                                 #
                                 # Cada 6 h y no diario porque el costo de una
                                 # corrida vacía es una consulta: `fetch_nodes_
                                 # pending_embedding` no devuelve nada y no se
                                 # llama a OpenAI. Sólo gasta cuando hay algo
                                 # que vectorizar, que es exactamente cuando
                                 # hace falta.
                                 #
                                 # A los :20 para no encimarse con el resto
                                 # (:00, :15 y :30 están tomados). El de las
                                 # 12:20 cae 20 min después de seia_sync, que es
                                 # el productor más pesado.
                                 #
                                 # OJO: este job reporta 1 cuando NO hay
                                 # pendientes, a propósito — ahí el cero es el
                                 # resultado sano y reportarlo haría que el
                                 # umbral de corridas vacías alertara justo
                                 # cuando funciona perfecto. Correrlo seguido es
                                 # inocuo para el monitoreo.
  workflow_dispatch:
    inputs:
      job:
        description: 'job_id a disparar (ver /jobs/list)'
        required: true
        default: cache_sweep

concurrency:
  group: bralidus-api-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar job de la API
        env:
          CRON_SECRET: ${{ secrets.BRALIDUS_CRON_SECRET }}
          API: https://api.animus.scouttech.lat
          SCHED: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          DISPATCH: ${{ github.event.inputs.job }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            JOB="$DISPATCH"
          else
            case "$SCHED" in
              '*/30 * * * *')       JOB=radar_refresh ;;
              '0 */2 * * *')        JOB=cache_sweep ;;
              '15 13,17,21 * * *')  JOB=cmf_sync ;;
              '30 11 * * 1-5')      JOB=concursal_sync ;;
              '0 11 * * 1')         JOB=bcch_sync ;;
              '0 13 * * 6')         JOB=empleo_sync ;;
              '0 12 */3 * *')       JOB=seia_sync ;;
              '0 3 * * 0')          JOB=fred_sync ;;
              '0 4 1 * *')          JOB=yfinance_sync ;;
              '20 */6 * * *')       JOB=embeddings_pendientes ;;
              *) echo "schedule no mapeado: $SCHED"; exit 1 ;;
            esac
          fi
          echo "Disparando job: $JOB"
          curl -fsS --max-time 300 -X POST "$API/jobs/run/$JOB" \
            -H "Authorization: Bearer $CRON_SECRET"
