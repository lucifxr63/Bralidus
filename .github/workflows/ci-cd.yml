name: Bralidus Developer Portal CI/CD

# OJO CON LAS RUTAS
# -----------------
# Este workflow vive en el repo del PORTAL (lucifxr63/Bralidus), donde
# package.json, src/ y services/ están en la RAÍZ. Estaba escrito con rutas del
# monorepo (`validateai-developer-portal/...`, `validateai/supabase/...`), que
# acá no existen — venía copiado de aquel contexto y nunca se adaptó.
#
# Sumado a que un `if` de step usaba el contexto `secrets` (invalido ahí), el
# archivo era rechazado al parsearse: 10 corridas seguidas fallando en 0 s sin
# ejecutar un solo paso. Nunca corrió el typecheck, ni los tests, ni el build.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: 🧪 Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck
        run: npx tsc --noEmit

      # Los E2E pegan contra la API real de Bralidus. Sin la key son ruido rojo
      # que no dice nada del commit, así que se saltean explícitamente en vez de
      # fallar: el pipeline debe romperse por el código, no por configuración
      # ausente.
      - name: 🧪 Run E2E Integration Tests
        env:
          # BralidusPY se migró de Railway a Vercel. El host de Railway devuelve
          # 404, así que estos E2E habrían fallado igual con la key puesta.
          VITE_BRALIDUS_API_URL: https://api.animus.scouttech.lat
          # El secret se llama CI_SMOKE (asi quedo creado). Se acepta tambien
          # BRALIDUS_TEST_API_KEY por si algun dia se renombra a algo que diga
          # QUE es y no solo para que se usa — el fallback evita que el rename
          # rompa el pipeline en silencio.
          VITE_TEST_BRALIDUS_KEY: ${{ secrets.CI_SMOKE || secrets.BRALIDUS_TEST_API_KEY }}
        run: |
          if [ -z "${VITE_TEST_BRALIDUS_KEY:-}" ]; then
            echo "::warning::Sin CI_SMOKE — se omiten los E2E contra la API real"
            exit 0
          fi
          # El archivo es animus-api.spec.ts. Antes decia bralidus-api.spec.ts,
          # que no existe: vitest salia con "No test files found" y codigo 1.
          # Nunca se habia notado porque sin la API key este paso se salteaba
          # antes de llegar a ejecutarlo.
          npx vitest run e2e/animus-api.spec.ts

      - name: 🏗️ Production Vite Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-portal
          path: dist/

  # NOTA: el despliegue de las Supabase Edge Functions NO vive acá.
  # Las funciones están en el monorepo (lucifxr63/stars), y ese repo tiene su
  # propio `deploy-functions.yml` que despliega sólo las que cambiaron. El job
  # que había en este archivo hacía `cd validateai/supabase`, una ruta que en
  # este repo no existe: nunca pudo haber funcionado.

  deploy-frontend:
    name: 🌐 Deploy Frontend to Vercel
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # El secret se expone como env del job para poder condicionar el step con
    # `env.VERCEL_TOKEN`. El contexto `secrets` NO está disponible en un `if` de
    # step: usarlo ahí invalida el workflow entero (ver nota de arriba).
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Se usa el CLI oficial y no `amondnet/vercel-action@v25`: esa action
      # pinnea Vercel CLI 25.1.0 (de 2022) y fallaba con
      #   "Could not retrieve Project Settings"
      # contra un proyecto de team, porque no entiende el formato actual de
      # prj_/team_. El CLI al dia lo resuelve solo con `vercel pull`.
      - name: Deploy a Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm i -g vercel@latest
          # `--scope` explicito: el proyecto vive bajo el team
          # "lucifxr63's projects", no bajo la cuenta personal. Si el token no
          # tiene alcance sobre ese team, `pull` falla con
          #   "Could not retrieve Project Settings"
          # aunque VERCEL_ORG_ID y VERCEL_PROJECT_ID sean correctos — el mensaje
          # sugiere borrar .vercel/, que en el runner ni siquiera existe, y
          # manda a buscar el problema al lugar equivocado.
          SCOPE=lucifxr63s-projects
          # `pull` baja la config del proyecto y lo linkea usando los IDs de
          # arriba — reemplaza al `.vercel/` que no existe en el runner.
          vercel pull --yes --environment=production --scope="$SCOPE" --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --scope="$SCOPE" --token="$VERCEL_TOKEN"

      - name: Aviso si falta el token
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::Sin VERCEL_TOKEN — se omite el deploy"

  notificar:
    name: 📣 Avisar a la sala de control
    # Un job resumen en vez de notificar desde cada uno: interesa el resultado
    # del pipeline completo, no avisos sueltos que hay que correlacionar.
    needs: [validate-and-test, deploy-frontend]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publicar en Discord
        env:
          HOOK: ${{ secrets.DISCORD_DEPLOYS_WEBHOOK }}
          TESTS: ${{ needs.validate-and-test.result }}
          FRONT: ${{ needs.deploy-frontend.result }}
        run: |
          # `if` y no `[ -z ] && { ... }`: con HOOK seteado ese test devuelve 1,
          # la linea entera devuelve 1 y bash -e (el shell por defecto de
          # Actions) mata el paso justo cuando SI habia que avisar.
          if [ -z "${HOOK:-}" ]; then
            echo "Sin DISCORD_DEPLOYS_WEBHOOK — se omite el aviso"
            exit 0
          fi

          # Verde sólo si todo pasó. Un 'skipped' cuenta como no-verde: significa
          # que algo no corrió, y eso no es un despliegue exitoso.
          if [ "$TESTS" = "success" ] && [ "$FRONT" = "success" ]; then
            COLOR=5234826; EMOJI="🟢"; ESTADO="desplegado"
          else
            COLOR=14700383; EMOJI="🔴"; ESTADO="con problemas"
          fi

          icono() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "⚠️";; esac; }

          # jq -Rs escapa el mensaje de commit: los títulos traen comillas,
          # backticks y saltos de línea que romperían el JSON armado a mano.
          MSG=$(git log -1 --pretty=%s | jq -Rs '.')
          SHA=$(git rev-parse --short HEAD)

          jq -n --argjson msg "$MSG" \
                --arg emoji "$EMOJI" --arg estado "$ESTADO" --arg sha "$SHA" \
                --arg actor "${{ github.actor }}" --argjson color "$COLOR" \
                --arg tests "$(icono "$TESTS") $TESTS" \
                --arg front "$(icono "$FRONT") $FRONT" \
                '{embeds:[{
                   title: ($emoji + "  Portal Bralidus " + $estado),
                   description: $msg,
                   color: $color,
                   fields: [
                     {name:"Tests & build", value:$tests, inline:true},
                     {name:"Frontend",      value:$front, inline:true},
                     {name:"Commit",        value:$sha,   inline:true},
                     {name:"Autor",         value:$actor, inline:true}
                   ],
                   footer:{text:"ci-cd · Deploys"}
                 }]}' \
            | curl -sS -X POST -H 'content-type: application/json' -d @- "$HOOK" >/dev/null
