name: Bralidus Developer Portal CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: 🧪 Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'validateai-developer-portal/package-lock.json'

      - name: Install Dependencies
        working-directory: validateai-developer-portal
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck
        working-directory: validateai-developer-portal
        run: npx tsc --noEmit

      - name: 🧪 Run E2E Integration Tests
        working-directory: validateai-developer-portal
        env:
          VITE_BRALIDUS_API_URL: https://braliduspy-production.up.railway.app
          VITE_TEST_BRALIDUS_KEY: ${{ secrets.BRALIDUS_TEST_API_KEY }}
        run: npx vitest run e2e/bralidus-api.spec.ts

      - name: 🏗️ Production Vite Build
        working-directory: validateai-developer-portal
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-portal
          path: validateai-developer-portal/dist/

  deploy-supabase-functions:
    name: 🚀 Deploy Supabase Edge Functions
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Deploying Supabase Edge Functions..."
            cd validateai/supabase
            supabase functions deploy api-v1 --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          else
            echo "SUPABASE_ACCESS_TOKEN not set. Skipping automated function deployment."
          fi

  deploy-frontend:
    name: 🌐 Deploy Frontend to Vercel
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # El secret se expone como env del job para poder condicionar el step con
    # `env.VERCEL_TOKEN`. El contexto `secrets` NO está disponible en un `if` de
    # step: usarlo ahí invalida el workflow ENTERO y GitHub lo rechaza al
    # parsearlo, sin ejecutar un solo job.
    #
    # Eso es exactamente lo que venía pasando: 10 corridas consecutivas
    # fallando en 0 s (nunca corrió el typecheck, ni los tests, ni el build) y
    # nadie lo notó, porque un fallo instantáneo se parece a "no había nada que
    # hacer". Los despliegues se venían haciendo a mano sin que el pipeline
    # existiera de verdad.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-portal
          path: validateai-developer-portal/dist/

      - name: Deploy to Vercel Action
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: validateai-developer-portal
          vercel-args: '--prod'

  notificar:
    name: 📣 Avisar a la sala de control
    # Un job resumen en vez de notificar desde cada uno: interesa el resultado
    # del pipeline completo, no tres avisos sueltos que hay que correlacionar.
    needs: [validate-and-test, deploy-supabase-functions, deploy-frontend]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publicar en Discord
        env:
          HOOK: ${{ secrets.DISCORD_DEPLOYS_WEBHOOK }}
          TESTS: ${{ needs.validate-and-test.result }}
          FUNCS: ${{ needs.deploy-supabase-functions.result }}
          FRONT: ${{ needs.deploy-frontend.result }}
        run: |
          [ -z "${HOOK:-}" ] && { echo "Sin DISCORD_DEPLOYS_WEBHOOK — se omite el aviso"; exit 0; }

          # Verde sólo si TODO pasó. Un 'skipped' cuenta como no-verde: significa
          # que algo no corrió y eso no es un despliegue exitoso.
          if [ "$TESTS" = "success" ] && [ "$FUNCS" = "success" ] && [ "$FRONT" = "success" ]; then
            COLOR=5234826; EMOJI="🟢"; ESTADO="desplegado"
          else
            COLOR=14700383; EMOJI="🔴"; ESTADO="con problemas"
          fi

          icono() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "⚠️";; esac; }

          # jq -Rs escapa el mensaje de commit: los titulos traen comillas,
          # backticks y saltos de linea que romperian el JSON armado a mano.
          MSG=$(git log -1 --pretty=%s | jq -Rs '.')
          SHA=$(git rev-parse --short HEAD)

          jq -n --argjson msg "$MSG" \
                --arg emoji "$EMOJI" --arg estado "$ESTADO" --arg sha "$SHA" \
                --arg actor "${{ github.actor }}" --argjson color "$COLOR" \
                --arg tests "$(icono "$TESTS") $TESTS" \
                --arg funcs "$(icono "$FUNCS") $FUNCS" \
                --arg front "$(icono "$FRONT") $FRONT" \
                '{embeds:[{
                   title: ($emoji + "  Portal Bralidus " + $estado),
                   description: $msg,
                   color: $color,
                   fields: [
                     {name:"Tests & build", value:$tests, inline:true},
                     {name:"Edge Functions", value:$funcs, inline:true},
                     {name:"Frontend",       value:$front, inline:true},
                     {name:"Commit",         value:$sha,   inline:true},
                     {name:"Autor",          value:$actor, inline:true}
                   ],
                   footer:{text:"ci-cd · Deploys"}
                 }]}' \
            | curl -sS -X POST -H 'content-type: application/json' -d @- "$HOOK" >/dev/null
