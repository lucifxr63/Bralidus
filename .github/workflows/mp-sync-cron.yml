name: mp-sync-cron

# Agenda los jobs de ingesta de Mercado Público del servicio `mp-sync`
# (services/mercado-publico, proyecto Vercel propio). Cada schedule dispara
# POST /jobs/run/{id} con MP_SYNC_CRON_SECRET — mismo patrón y mismo contrato
# que bralidus-api-cron.yml, para que ambos servicios se operen igual.
#
# El servicio ARRANCA un workflow durable y responde de inmediato con el runId:
# el curl no espera a que termine el sync, así que estos jobs no chocan con el
# límite de duración de una función serverless (a diferencia de los de
# bralidus-api, que sí ejecutan inline).
#
# Horarios heredados de los cron triggers de Cloudflare (wrangler.jsonc), en UTC.
# Chile = UTC-4. Diferencia a favor: Cloudflare topaba en 5 crons por Worker y
# obligaba a lanzar Compra Ágil desde el tick de las 06:00 con `delayMinutes`;
# acá tiene su propio horario y ese rodeo ya no hace falta.
#
# NOTA: los `schedule` sólo corren desde la rama default (master) — activos tras merge.

on:
  schedule:
    - cron: '0 6 * * *'      # sync-licitaciones (02:00 Chile)
    - cron: '30 6 * * *'     # sync-ordenes (02:30 Chile) — escalonado para no saturar MP
    - cron: '0 7 * * *'      # sync-compra-agil (03:00 Chile)
    - cron: '15 */6 * * *'   # refresh-opportunities (cada 6 h a los :15)
    - cron: '0 3 * * 0'      # build-buyer-profiles (dom 03:00)
    - cron: '30 12 * * *'    # reporte-frescura (08:30 Chile) — despues de que
                             # corrieron los syncs de la madrugada, para que el
                             # digest de la mañana refleje la noche.
    - cron: '0 5 * * 1'      # sync-pjud (lunes 01:00 Chile). Semanal y no diario
                             # porque la fuente publica series ANUALES: correrlo
                             # a diario serian 11 requests para reescribir lo
                             # mismo. Ver docs/PJUD_API_HALLAZGOS.md.
    - cron: '0 13 * * 1'     # reporte-pjud (lunes 09:00 Chile) — tablero de la
                             # Corte Suprema en la sala de control.
                             #
                             # Semanal y no diario: la ingesta es mensual, asi
                             # que publicarlo a diario serian seis avisos
                             # identicos por semana. El lunes por la mañana es
                             # cuando alguien lo va a mirar.
    - cron: '0 8 1 * *'      # sync-pjud-suprema (día 1 de cada mes, 04:00 Chile).
                             #
                             # Mensual y no diario: la fuente publica por año
                             # cerrado, asi que correrlo seguido serian ~96 MB
                             # de descarga para reescribir exactamente las
                             # mismas 124.245 filas. Mensual alcanza para tomar
                             # correcciones tardias del ano anterior.
                             #
                             # El upsert es idempotente, asi que reingerir no
                             # duplica. Ver docs/PJUD_API_HALLAZGOS.md.
    - cron: '45 */2 * * *'   # enrich-ordenes (cada 2 h a los :45).
                             #
                             # NO ESTABA AGENDADO: solo corria encadenado al
                             # final de sync-ordenes, una vez al dia. Medido el
                             # 2026-07-31 quedaban 78.731 OCs pendientes a 100
                             # por pasada — mas de dos años a ese ritmo.
                             #
                             # Con ENRICH_OC_MAX_SLICES=10 cada disparo drena
                             # hasta 1.000, y 12 disparos diarios dan ~12.000:
                             # la cola se vacia en alrededor de una semana.
                             #
                             # A los :45 para no encimarse con los syncs (:00 y
                             # :30) ni con refresh-opportunities (:15). La
                             # cadena corta sola si MP responde 429, asi que
                             # sobrepasarse se autolimita en vez de romperse.
  workflow_dispatch:
    inputs:
      job:
        description: 'job_id a disparar (ver /jobs/list)'
        required: true
        default: refresh-opportunities
      options:
        description: 'JSON de opciones, ej. {"lookbackDays":7}'
        required: false
        default: '{}'
        # OJO al disparar desde la CLI en Windows: PowerShell 5.1 se come las
        # comillas dobles al pasar argumentos a un ejecutable nativo, así que
        #     gh workflow run ... -f options='{"startDate":"2026-01-01"}'
        # llega como {startDate:2026-01-01} — JSON inválido. El servicio lo
        # atrapa en un try/catch que cae a `{}` y la corrida arranca con los
        # defaults SIN avisar: un backfill pedido para enero corre el día de
        # ayer. Pasó dos veces el 2026-07-29 antes de detectarse.
        #
        # Forma que sí funciona (redirección de cmd, evita el pipeline de PS):
        #     cmd /c "gh workflow run mp-sync-cron.yml --ref master --json < payload.json"
        # con payload.json = {"job":"sync-ordenes","options":"{\"startDate\":...}"}
        # y SIN BOM — el pipe de PowerShell agrega uno y gh rechaza el JSON.

concurrency:
  group: mp-sync-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar job de ingesta
        env:
          CRON_SECRET: ${{ secrets.MP_SYNC_CRON_SECRET }}
          # Variable de repo: URL del proyecto Vercel de mp-sync.
          # Setear en Settings → Secrets and variables → Actions → Variables.
          API: ${{ vars.MP_SYNC_API_URL }}
          SCHED: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          DISPATCH: ${{ github.event.inputs.job }}
          # Comillas simples defensivas para que el JSON llegue como escalar y
          # no como flow mapping de YAML.
          #
          # CORRECCIÓN a lo que decía este comentario antes: YAML no era la
          # causa de que las opciones llegaran sin comillas. Se verificó que con
          # estas comillas puestas el problema persistía, y que desaparecía al
          # cambiar CÓMO se dispara desde el cliente (ver nota en `options`
          # arriba: PowerShell 5.1 mangea las comillas dobles hacia ejecutables
          # nativos). Esto queda como endurecimiento, no como el arreglo.
          OPTIONS: '${{ github.event.inputs.options }}'
        run: |
          set -euo pipefail

          if [ -z "${API:-}" ]; then
            echo "::error::Falta la variable de repo MP_SYNC_API_URL (URL del proyecto Vercel de mp-sync)"
            exit 1
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            JOB="$DISPATCH"
            BODY="$OPTIONS"
            [ -z "$BODY" ] && BODY='{}'
          else
            case "$SCHED" in
              '0 6 * * *')     JOB=sync-licitaciones ;;
              '30 6 * * *')    JOB=sync-ordenes ;;
              '0 7 * * *')     JOB=sync-compra-agil ;;
              '15 */6 * * *')  JOB=refresh-opportunities ;;
              '0 3 * * 0')     JOB=build-buyer-profiles ;;
              '30 12 * * *')   JOB=reporte-frescura ;;
              '0 5 * * 1')     JOB=sync-pjud ;;
              '45 */2 * * *')  JOB=enrich-ordenes ;;
              '0 8 1 * *')     JOB=sync-pjud-suprema ;;
              '0 13 * * 1')    JOB=reporte-pjud ;;
              *) echo "::error::schedule no mapeado: $SCHED"; exit 1 ;;
            esac
            BODY='{}'
          fi

          echo "Disparando job: $JOB"
          # --max-time bajo a propósito: el endpoint sólo encola el workflow.
          curl -fsS --max-time 60 -X POST "$API/jobs/run/$JOB" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "$BODY"
